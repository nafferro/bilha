name: Bilha
options:
  bundleIdPrefix: pt.nunoferro
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: 6YV9FKUYTL
    CODE_SIGN_STYLE: Automatic
targets:
  Bilha:
    type: application
    platform: iOS
    sources: [Bilha]
    info:
      path: Bilha/Info.plist
      properties:
        CFBundleDisplayName: Bilha
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pt-PT]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: This app uses Bluetooth to read your gas bottle.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.nunoferro.bilha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BilhaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BilhaTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pt.nunoferro.bilha.tests
    dependencies:
      - target: Bilha
schemes:
  Bilha:
    build:
      targets:
        Bilha: all
    test:
      targets: [BilhaTests]
